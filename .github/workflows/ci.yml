name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, bpp-server]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        if: matrix.service == 'backend'
        run: npm test

      - name: Check JavaScript syntax
        working-directory: .
        run: |
          find "${{ matrix.service }}" -type f -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -r -n1 node --check
