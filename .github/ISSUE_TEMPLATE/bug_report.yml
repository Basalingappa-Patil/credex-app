name: Bug report
description: Report a reproducible problem in CredEx
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Please do not include passwords, tokens, private keys, personal data, or production records."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frontend
        - Backend API
        - BPP service
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, OS, browser, and deployment mode (if relevant).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets, tokens, personal data, and private URLs before posting.
    validations:
      required: false
